# Push a tag like v0.1.0, or publish a release with a new tag on
# github.com: tests run, the zip is built with the public Hardcover client
# ID (repository secret HC_CLIENT_ID) and attached to the release (created
# if it does not exist). The Kindle page shows an update banner when its
# version is older than the latest release.
name: Release
on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]
concurrency:
  group: release-${{ github.ref_name }}
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - run: go test -race ./...
      - name: Build
        env:
          HC_CLIENT_ID: ${{ secrets.HC_CLIENT_ID }}
        run: |
          test -n "$HC_CLIENT_ID" || { echo "secret HC_CLIENT_ID is not set"; exit 1; }
          ./scripts/build.sh
          test -f "dist/endpaper-${GITHUB_REF_NAME}.zip"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="dist/endpaper-${GITHUB_REF_NAME}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Endpaper $GITHUB_REF_NAME" --generate-notes
          fi
